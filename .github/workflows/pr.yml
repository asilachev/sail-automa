# Pull request checks (AGENTS.md → Core → Git), from agent-app-boilerplate's core layer.
# The commit-msg hook never sees a squash-merge made on GitHub, so the PR title, which becomes
# that commit's subject, is checked here. So is the body, which no hook sees.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          if ! printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([a-z0-9._/-]+\))?!?: [^ ]"; then
            echo "::error title=PR title::The title becomes the squash commit's subject, so it must be a Conventional Commit, such as \"feat: add a project\". Got: $TITLE"
            exit 1
          fi
      - name: The body has no AI attribution
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          agents='anthropic|claude|openai|chatgpt|codex|copilot|cursor|devin|gemini|aider|\[bot\]'
          tools='claude|chatgpt|codex|copilot|cursor|devin|gemini|aider'
          if printf '%s\n' "$BODY" | grep -Eiq "^co-authored-by:.*($agents)|^[^[:alnum:]]*generated (with|by) \[?($tools)|^claude-session:|^[^[:alnum:]]*https://claude\.ai/code/session"; then
            echo "::error title=PR body::Agents are not authors here: remove Co-Authored-By trailers, \"Generated with\" lines and session links."
            exit 1
          fi
